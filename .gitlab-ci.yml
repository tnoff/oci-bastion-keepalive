stages:
  - pr-check
  - test
  - push
  - notify
  - renovate

default:
  # Ride out ci-pool cold-starts / node churn (warm ci floor + autoscaler
  # scale-down grace live in terraform nodes_v2_ci and docker-apps
  # cluster-autoscaler). These `when:` classes are infra-side failures, never
  # `script_failure`, so a failing test/lint is never silently retried. GitLab
  # caps retry:max at 2 (= 3 total attempts).
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  tags:
    - self-hosted

# Static-analysis gate via tox (pylint + bandit). Lint-only by design — this is
# a single-file operational daemon, not a tested library, so there's no
# tox pytest/diff-cover matrix.
"pr-check:lint":
  stage: pr-check
  image: python:3.14-slim
  script:
    - pip install --quiet tox
    - tox
  rules:
    # MR-only: main advances only via FF/squash merges of validated MRs (direct
    # push is blocked), so re-linting the merge commit is redundant. This keeps
    # the whole validate stage off the default-branch pipeline (matches
    # spellcheck/trufflehog), leaving merges to run tag -> release -> notify.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Resolve the full runtime dependency tree without installing anything. tox is
# lint-only (skip_install=true), so nothing else in CI ever runs pip's resolver
# against the pinned deps — which is how a kubernetes/oci-cli PyYAML conflict
# once merged undetected. `--dry-run` raises ResolutionImpossible on any
# unsatisfiable pin set. Upgrade pip first: --dry-run needs pip>=22.2.
"pr-check:deps":
  stage: pr-check
  image: python:3.14-slim
  script:
    - pip install --quiet --upgrade pip
    - pip install --dry-run .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

"pr-check:spellcheck":
  extends: .spellcheck
  stage: pr-check

"pr-check:secrets":
  extends: .trufflehog
  stage: pr-check
  rules:
    # Fork MRs require a project member to manually trigger jobs.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Auto-bump the patch version (and prepend a CHANGELOG entry) on Renovate MRs
# so each one merges as its own taggable version.
bump-version:
  extends: .bump-version
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
    BUMP_CHANGELOG: 'true'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//

# Folds accumulated changelog.d/*.md fragments into CHANGELOG.md on the default
# branch at release, deletes them, pushes back (idempotent — no-op when empty).
"assemble-changelog":
  extends: .assemble-changelog
  stage: .pre
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# On merge to main: tag v<VERSION> (no-op if it exists) ...
"push:tag":
  extends: .tag
  stage: push
  variables:
    GATE_ON_FRAGMENTS: 'true'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# ... and cut a GitLab Release from that tag, using the CHANGELOG section.
"push:release":
  extends: .release
  stage: push
  needs:
    - job: "push:tag"
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

"notify:mr-opened":
  extends: .discord-notify
  stage: notify
  needs: []
  variables:
    NOTIFY_TYPE: mr_opened
    DISCORD_WEBHOOK_URL: $DISCORD_MR_OPENED_WEBHOOK
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

"notify:merged":
  extends: .discord-notify
  stage: notify
  needs: []
  variables:
    NOTIFY_TYPE: mr_merged
    DISCORD_WEBHOOK_URL: $DISCORD_MR_MERGED_WEBHOOK
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: always

renovate:
  extends: .renovate
  stage: renovate
  variables:
    GITHUB_COM_TOKEN: $GITHUB_BOT_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

branch-cleanup:
  extends: .branch-cleanup
  stage: renovate
  variables:
    CLEANUP_AGE_DAYS: "30"
    DRY_RUN: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

