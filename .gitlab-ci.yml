    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/bump-version.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/assemble-changelog.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/tag.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/release.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
