[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-bastion-keepalive"
description = "Keep an OCI bastion SSH tunnel to a private OKE API server alive across the session hard-TTL by rotating sessions under a fixed local port"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Tyler D. North", email = "me@tyler-north.com" },
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "oci==2.183.0",
    # Held at 36.0.0 — the newest kubernetes compatible with oci-cli. From
    # 36.0.1 on it requires pyyaml>=6.0.3, but every oci-cli release (incl.
    # 3.90.0) caps PyYAML<=6.0.2, so a newer kubernetes is an unresolvable pip
    # set. Bump only if oci-cli relaxes its PyYAML pin.
    "kubernetes==36.0.0",
    # The kubeconfig authenticates via an exec plugin that runs the `oci` CLI
    # (`oci ce cluster generate-token`); bundle it so port-forwards work out of
    # the box. Pinned to the build that resolves against oci==2.181.0.
    "oci-cli==3.90.0",
]

[project.urls]
Homepage = "https://gitlab.com/tnoff-projects/oci-bastion-keepalive"

[project.scripts]
oci-bastion-keepalive = "rotate_session:main"

[tool.setuptools]
py-modules = ["rotate_session"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
