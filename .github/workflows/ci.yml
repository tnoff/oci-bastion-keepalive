name: CI

# Pull-request checks, ported from .gitlab-ci.yml's pr-check stage. Shared jobs
# come from tnoff/github-workflows, SHA-pinned the same way the GitLab
# `include:` refs were; Renovate's github-actions manager keeps the pins
# current.
#
# Two jobs below are INLINE rather than reusable-workflow calls, and that is a
# deliberate choice rather than an omission -- see each one.

on:
  pull_request:

# One in-flight run per PR. Renovate force-pushes on rebase
# (rebaseWhen: behind-base-branch), and without this every rebase leaves its
# predecessor running to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR that touches only catalog-info.yaml or renovate.json changes nothing any
  # job here inspects: no source, no image input, no packaging metadata, no
  # workflow. So all of them gate on this and CI reduces to the aggregate.
  #
  # This MUST stay a job-level `if:` and never become a workflow-level
  # `paths-ignore`. The branch ruleset requires the `CI result` context;
  # `paths-ignore` stops the whole workflow, so that context never reports at all
  # -- and a required check that never reports blocks the PR forever, where a
  # SKIPPED job scores as success. The two failure modes look nothing alike.
  #
  # Two files, named exactly, anchored. Not a prefix, not a glob, not a
  # deny-list of "things that feel unimportant": a list that grows by feel is one
  # somebody eventually adds a file to that did matter.
  #
  # An empty or unreadable diff yields false, which runs everything.
  metadata:
    name: Detect metadata-only change
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      only: ${{ steps.filter.outputs.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          ONLY=false
          if [ -n "${FILES}" ]; then
            OTHER="$(printf '%s\n' "${FILES}" | grep -vE '^(catalog-info\.yaml|renovate\.json)$' || true)"
            [ -z "${OTHER}" ] && ONLY=true
          fi
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "metadata-only: ${ONLY}"
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

  secrets:
    name: Scan for secrets
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@b7790887a768e86127e2b6a29ed06631c947972f  # trufflehog-v1.0.1

  spellcheck:
    name: Spellcheck
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/spellcheck.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # spellcheck-v1.0.0
    with:
      name: Markdown

  # The interpreter matrix comes from tox.ini (`tox -l`), the same pattern as
  # the shared tox.yml and discord-bot, so adding or dropping a pyXY env there
  # is the only edit needed. Inline for the same reason as `lint` below.
  discover:
    name: Discover tox environments
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install tox
        run: pip install --quiet tox

      - name: List environments
        id: list
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess

          out = subprocess.run(['tox', '-l'], capture_output=True, text=True, check=True)
          versions = []
          for env in out.stdout.split():
              m = re.fullmatch(r'py(\d)(\d+)', env)
              if m:
                  versions.append(f'{m.group(1)}.{m.group(2)}')
          if not versions:
              raise SystemExit('No py<X><Y> envs found via `tox -l`')
          print(f'versions={versions}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'versions={json.dumps(versions)}\n')
          PYEOF

  # INLINE, not tnoff/github-workflows tox.yml. The matrix still comes from
  # tox.ini via `discover` above.
  #
  # That reusable workflow cannot run here: the pyXY envs are lint-only
  # (skip_install, pylint + bandit; a one-file operational daemon with no test
  # suite by design), so it would try to upload a coverage.xml that is never
  # produced, with if-no-files-found: error, and diff-cover has nothing to read.
  #
  # Adding a lint-only mode to the shared workflow was considered and rejected:
  # this is the only such repo in the fleet, so it would be shared surface for
  # N=1. Promote it if a second repo ever needs it.
  lint:
    name: Lint (${{ matrix.python }})
    needs: [metadata, discover]
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.discover.outputs.versions) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install tox
        run: pip install --quiet tox

      - name: Run tox
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: tox -e "py${PYTHON_VERSION//./}"

  # INLINE, and there is no template for this anywhere in github-workflows.
  #
  # Resolves the full runtime dependency tree without installing anything. tox
  # above is lint-only (skip_install = true), so nothing else in CI ever runs
  # pip's resolver against the pinned deps -- which is how a kubernetes/oci-cli
  # PyYAML conflict once merged undetected. `--dry-run` raises
  # ResolutionImpossible on any unsatisfiable pin set.
  #
  # This is the job the renovate.json packageRules exist to complement: oci and
  # oci-cli are grouped so they move together, and kubernetes is held at
  # <=36.0.0 for exactly the PyYAML conflict above. Dropping this check would
  # leave those rules as the only guard, with nothing verifying them.
  #
  # pip is upgraded first: --dry-run needs pip>=22.2.
  deps:
    name: Resolve dependencies (${{ matrix.python }})
    needs: [metadata, discover]
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.discover.outputs.versions) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve the pin set without installing
        run: |
          pip install --quiet --upgrade pip
          pip install --dry-run .

  bump-version:
    name: Bump version
    # NOTE: '^renovate/', NOT '^renovate/dev-' as everywhere else in the fleet.
    # This repo's GitLab rule was deliberately broader -- every Renovate MR
    # merges as its own taggable version here. Narrowing it to dev- would
    # silently stop cutting releases for most updates. The one exception is
    # 'renovate/ci-' (renovate.json): workflow-only updates ship nothing.
    if: startsWith(github.head_ref, 'renovate/') && !startsWith(github.head_ref, 'renovate/ci-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # bump-version-v1.1.1
    with:
      bump_changelog: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Catches a `uses:` whose inputs or secrets no longer match the pinned callee.
  # That mismatch fails the calling workflow at STARTUP -- no job is created, no
  # check reports, and no `workflow_run` event fires -- so neither this checks
  # list nor notify-failure.yml can see it. It is how one upstream secret rename
  # left `Release` dead in nine repos for five days in September 2026.
  contracts:
    name: Workflow contracts
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # check-workflow-contracts-v1.0.0

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, spellcheck, discover, lint, deps, contracts, metadata]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:    ${{ needs.secrets.result }}"
          echo "metadata:  ${{ needs.metadata.result }}"
          echo "spellcheck: ${{ needs.spellcheck.result }}"
          echo "discover:   ${{ needs.discover.result }}"
          echo "lint:       ${{ needs.lint.result }}"
          echo "deps:       ${{ needs.deps.result }}"
          echo "contracts:  ${{ needs.contracts.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.spellcheck.result == 'failure' || needs.spellcheck.result == 'cancelled' ||
          needs.discover.result == 'failure' || needs.discover.result == 'cancelled' ||
          needs.lint.result == 'failure' || needs.lint.result == 'cancelled' ||
          needs.deps.result == 'failure' || needs.deps.result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled' ||
          needs.metadata.result == 'failure' || needs.metadata.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
