name: Release

# Default-branch pipeline, replacing the GitLab `push` stage.
#
# Two-pass design carried over from GitLab: assemble-changelog folds any
# pending changelog.d fragments into CHANGELOG.md and pushes; tag runs with
# gate_on_fragments and DEFERS while fragments are still present, so this pass
# cuts no tag. That fold push triggers a fresh run where the fragment directory
# is empty, the gate passes, and tag + release run against the assembled
# changelog.
#
# The push token must be a PAT, not GITHUB_TOKEN: a GITHUB_TOKEN push triggers
# no follow-up run, so the second pass never happens and no release is ever cut
# -- with every job green.
#
# No image job: this repo has no Dockerfile.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@93f9034849dfd1d98ed72629241a503d29842205  # assemble-changelog-v1.1.0
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # tag-v1.0.0
    with:
      gate_on_fragments: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/release.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # release-v1.0.0
    with:
      version: ${{ needs.tag.outputs.version }}
      tag_created: ${{ needs.tag.outputs.tag_created }}
